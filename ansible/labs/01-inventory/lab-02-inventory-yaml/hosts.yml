# ==============================================================================
# INVENTORY FILE (YAML FORMAT): hosts.yml
# Data: Docker Swarm & Database Cluster
# ==============================================================================
---
# 'all:' adalah root group utama bawaan Ansible (grup paling atas/kakek buyut).
all:
  # --- [1] VARIABEL GLOBAL (vars) ---
  # 'vars:' yang ditaruh langsung di bawah 'all:' akan diwariskan ke SEMUA grup dan host.
  # Fungsinya identik dengan [all:vars] pada format INI.
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_ansible

  # --- [2] DAFTAR SUB-GRUP (children) ---
  # 'children:' adalah kata kunci mutlak untuk mendefinisikan grup di dalam grup.
  # Karena 'Docker_Swarm' dan 'Database' adalah grup turunan dari 'all',
  # maka keduanya diletakkan menjorok di bawah 'children:'.
  children:

    # Grup 1: Docker_Swarm
    Docker_Swarm:
      # 'hosts:' adalah kata kunci mutlak yang berisi server-server sungguhan (IP/hostname).
      # Tanda titik dua (:) di akhir IP wajib ada karena di YAML ini berperan sebagai key.
      hosts:
        192.168.1.11:
        192.168.1.12:
        192.168.1.13:

    # Grup 2: Database
    Database:
      hosts:
        192.168.1.20:

    # (Opsional) Contoh Nested Group 'production' di YAML:
    # production:
    #   children:
    #     Docker_Swarm:
    #     Database:

# ==============================================================================
# INVENTORY FILE (INI FORMAT): hosts.ini
# Data: Docker Swarm & Database Cluster
# ==============================================================================

# --- [1] DEFINISI GRUP & HOST (SERVER TARGET) ---
# Tanda kurung siku [...] menandakan nama grup.
# Baris-baris di bawahnya adalah daftar alamat IP dummy atau hostname server anggota grup.

[Docker_Swarm]
192.168.1.11
192.168.1.12
192.168.1.13

[Database]
192.168.1.20

# --- [2] NESTED GROUP (GRUP INDUK / PARENT GROUP) ---
# Format [<nama_induk>:children] digunakan untuk menggabungkan beberapa sub-grup.
# Di sini grup 'production' membawahi grup 'Docker_Swarm' dan 'Database'.
[production:children]
Docker_Swarm
Database

# --- [3] VARIABEL GRUP (GROUP VARIABLES) ---
# [all:vars] adalah pseudo-group bawaan Ansible.
# Variabel di bawah ini otomatis berlaku untuk SELURUH host di semua grup.
[all:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ansible

# TIPS:
# Jika nanti server Database punya kredensial berbeda, cukup tambahkan:
# [Database:vars]
# ansible_user=dbadmin
# ansible_ssh_private_key_file=~/.ssh/id_database
